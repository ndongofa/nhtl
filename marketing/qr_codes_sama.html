<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMA — QR Codes Officiels</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: #0a1628;
      color: white;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    .logo { font-size: 56px; font-weight: 900; color: #00c878; letter-spacing: -2px; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 32px; letter-spacing: 2px; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
    }
    .card h2 { font-size: 18px; margin-bottom: 10px; }
    .card p { font-size: 12px; color: rgba(255,255,255,0.65); margin-bottom: 16px; word-break: break-all; }
    .card img {
      width: 260px;
      max-width: 100%;
      height: auto;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .card a {
      color: #00e68a;
      font-weight: 700;
      text-decoration: none;
      font-size: 13px;
    }
    .card a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">SAMA</div>
    <div class="subtitle">QR Codes des liens principaux</div>

    <div class="grid">
      <div class="card">
        <h2>🏠 Accueil</h2>
        <p>https://www.sama-services-intl.com/</p>
        <img src="qrcodes/sama-services-home-qrcode.png" alt="QR code vers la page d'accueil SAMA">
        <a href="https://www.sama-services-intl.com/" target="_blank" rel="noopener noreferrer">Ouvrir le lien</a>
      </div>

      <div class="card">
        <h2>✈️ Transport</h2>
        <p>https://www.sama-services-intl.com/transport</p>
        <img src="qrcodes/sama-services-transport-qrcode.png" alt="QR code vers la page transport SAMA">
        <a href="https://www.sama-services-intl.com/transport" target="_blank" rel="noopener noreferrer">Ouvrir le lien</a>
      </div>
    </div>
  </div>
</body>
</html>
